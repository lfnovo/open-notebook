name: NovaHQ custom image

# Builds THIS fork's code (not a copy of upstream), boots it against an isolated
# SurrealDB, checks the new routes, and only then publishes to GHCR.
# nova-baseline.yml stays the upstream-copy gate; this one carries our patches.

on:
  # Merge to main builds, smoke-tests and publishes automatically. Deploying to
  # CT190 is still a manual, backed-up step (see the open-notebook skill).
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/nova-baseline.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish (default: v1.15.0-nova.<run number>)'
        required: false
        type: string

concurrency:
  group: nova-custom
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  TARGET_IMAGE: ghcr.io/heli-konton/open-notebook
  IMAGE_TAG: ${{ inputs.tag || format('v1.15.0-nova.{0}', github.run_number) }}

jobs:
  build-smoke-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build runtime image (linux/amd64, loaded locally, not pushed yet)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          platforms: linux/amd64
          load: true
          push: false
          tags: nova-open-notebook:candidate

      - name: Start isolated SurrealDB and app
        run: |
          docker network create nova-open-notebook-test
          docker run -d --name nova-surreal --network nova-open-notebook-test \
            surrealdb/surrealdb:v2 start --log info --user root --pass root memory
          docker run -d --name nova-open-notebook --network nova-open-notebook-test \
            -p 127.0.0.1:15055:5055 -p 127.0.0.1:18502:8502 \
            -e OPEN_NOTEBOOK_ENCRYPTION_KEY=nova-custom-ephemeral-test-key \
            -e OPEN_NOTEBOOK_PASSWORD=nova-custom-ephemeral-password \
            -e API_URL=http://127.0.0.1:18502 \
            -e INTERNAL_API_URL=http://localhost:5055 \
            -e SURREAL_URL=ws://nova-surreal:8000/rpc \
            -e SURREAL_USER=root -e SURREAL_PASSWORD=root \
            -e SURREAL_NAMESPACE=open_notebook -e SURREAL_DATABASE=open_notebook \
            nova-open-notebook:candidate

      - name: Smoke test (health, UI, migration 26 routes)
        run: |
          api=000; ui=000
          for attempt in $(seq 1 90); do
            api=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:15055/health || true)
            ui=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:18502/ || true)
            if [[ "$api" == "200" && ( "$ui" == "200" || "$ui" == "307" ) ]]; then break; fi
            sleep 2
          done
          echo "api=$api ui=$ui"
          test "$api" = 200
          test "$ui" = 200 -o "$ui" = 307
          H="Authorization: Bearer nova-custom-ephemeral-password"
          # New field/filter only works if migration 26 ran and the new code is live.
          code=$(curl -sS -o /tmp/eps.json -w '%{http_code}' -H "$H" \
            "http://127.0.0.1:15055/api/podcasts/episodes?notebook_id=notebook:smoke")
          echo "episodes?notebook_id -> $code"; cat /tmp/eps.json; echo
          test "$code" = 200
          # Discover must exist and validate input (422), not 404/405.
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H "$H" -H 'Content-Type: application/json' \
            -X POST -d '{"prompt":"x"}' http://127.0.0.1:15055/api/notebooks/discover)
          echo "discover(short prompt) -> $code"
          test "$code" = 422
          # Dropped-file notes need migration 29 and a working extractor in the image:
          # upload a text file, then read the original back.
          nb=$(curl -sS -H "$H" -H 'Content-Type: application/json' -X POST -d '{"name":"smoke"}' \
            http://127.0.0.1:15055/api/notebooks | python3 -c 'import sys,json;print(json.load(sys.stdin)["id"])')
          echo "smoke from file" > /tmp/smoke.txt
          note=$(curl -sS -H "$H" -F "notebook_id=$nb" -F "file=@/tmp/smoke.txt" \
            http://127.0.0.1:15055/api/notes/upload)
          echo "upload -> $note"
          nid=$(echo "$note" | python3 -c 'import sys,json;print(json.load(sys.stdin)["id"])')
          test "$(curl -sS -H "$H" "http://127.0.0.1:15055/api/notes/$nid/file")" = "smoke from file"
          docker logs nova-open-notebook 2>&1 | grep -i "migration" | tail -5

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        run: |
          docker tag nova-open-notebook:candidate "$TARGET_IMAGE:$IMAGE_TAG"
          docker tag nova-open-notebook:candidate "$TARGET_IMAGE:sha-${GITHUB_SHA::7}"
          docker tag nova-open-notebook:candidate "$TARGET_IMAGE:nova-custom"
          docker push "$TARGET_IMAGE:$IMAGE_TAG"
          docker push "$TARGET_IMAGE:sha-${GITHUB_SHA::7}"
          docker push "$TARGET_IMAGE:nova-custom"
          docker buildx imagetools inspect "$TARGET_IMAGE:$IMAGE_TAG"

      - name: Diagnostic logs on failure
        if: failure()
        run: |
          docker logs nova-surreal 2>&1 | tail -50 || true
          docker logs nova-open-notebook 2>&1 | tail -150 || true

      - name: Cleanup
        if: always()
        run: |
          docker rm -f nova-open-notebook nova-surreal 2>/dev/null || true
          docker network rm nova-open-notebook-test 2>/dev/null || true
