services:
  surrealdb:
    image: surrealdb/surrealdb:v2
    command: start --log info --user root --pass root rocksdb:/mydata/mydatabase.db
    user: root
    ports:
      - "8000:8000"
    volumes:
      - ./surreal_data:/mydata
    restart: always

  open_notebook:
    build: .
    ports:
      - "8502:8502"
      - "5055:5055"
    env_file:
      - .env
    volumes:
      - ./notebook_data:/app/data
    depends_on:
      - surrealdb
    restart: always