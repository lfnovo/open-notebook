version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      all-actions:
        patterns:
          - "*"
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      all-python:
        patterns:
          - "*"
      python-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      # Minor and patch updates travel together; majors arrive as their own PRs
      # so one breaking package can't block the rest (#1371, #1410 failed whole).
      all-npm:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # The direct katex dependency only provides katex.min.css; rendering is
      # done by rehype-katex with its own katex (^0.16). The stylesheet must
      # match the renderer's version, so katex moves when rehype-katex does.
      - dependency-name: "katex"
        versions: [">=0.17.0"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    ignore:
      # Base-image majors are deliberate migrations, not routine bumps:
      # Node moves between LTS lines on purpose (#1381, #1406), and a SurrealDB
      # major changes the on-disk format of the -single image's database — v3
      # is tracked in #378 and needs the upgrade gate (make release-test).
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "surrealdb/surrealdb"
        update-types: ["version-update:semver-major"]
    groups:
      all-docker:
        patterns:
          - "*"
      docker-security:
        applies-to: security-updates
        patterns:
          - "*"
